# Server — the platform (Render/Railway/etc.) sets PORT
server.port=${PORT:8080}

app.frontend.url=${FRONTEND_URL:}
# In the monolith deployment the frontend is served from the same origin as the
# API, so CORS is mostly a formality for any external API consumers.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST}:${SUPABASE_PORT}/${SUPABASE_DB}?sslmode=require
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JavaMail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@edutrack.school}

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.edutrack=INFO
logging.level.root=WARN

# First-boot admin bootstrap (only used if no ADMIN account exists yet)
app.admin.seed-email=${ADMIN_EMAIL}
app.admin.seed-password=${ADMIN_PASSWORD}
app.admin.seed-name=${ADMIN_NAME:School Admin}
