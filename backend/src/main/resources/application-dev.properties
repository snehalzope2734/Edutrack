# Server
server.port=8080

app.frontend.url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# PostgreSQL (local/dev). In production these come from Supabase; locally point
# at any Postgres 15+ instance (docker run postgres:16 works fine).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edutrack}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Flyway owns the schema, Hibernate only validates it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MongoDB Atlas (or local mongod for dev)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/edutrack}

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-make-it-at-least-64-chars-long}
app.jwt.expiration-ms=28800000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JavaMail (Gmail SMTP) — in dev, point at Mailtrap/Ethereal or leave uncommitted;
# EmailService swallows send failures so the app still runs without real SMTP creds.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@edutrack.school}

# File upload limits (attendance Excel imports)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.edutrack=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Development CORS origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:5175,http://localhost:3000

# First-boot admin bootstrap (only used if no ADMIN account exists yet)
app.admin.seed-email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.seed-password=${ADMIN_PASSWORD:admin@123}
app.admin.seed-name=${ADMIN_NAME:School Admin}
